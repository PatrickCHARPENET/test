<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Hello World</title>
</head>

<body>
  <h1>Hello World</h1>

  <button onclick="bonjour()">Clique-moi</button>

  <p id="message"></p>

  <script>
    function bonjour() {
      document.getElementById("message").innerText = "Ça marche !";
    }
  </script>
</body>
</html>
